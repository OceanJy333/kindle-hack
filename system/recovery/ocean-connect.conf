# input: internal-partition guard; output: SSH that returns after every boot or crash; pos: original-system recovery service.
# Runs after ocean-autoboot exits, i.e. only when this boot stays on stock.
start on stopped ocean-autoboot
stop on stopping system
respawn
respawn limit 20 300
script
 for i in $(seq 1 60); do [ -x /var/local/ocean/connect/ocean-connectd.sh ] && break; sleep 2; done
 exec /bin/sh /var/local/ocean/connect/ocean-connectd.sh
end script
